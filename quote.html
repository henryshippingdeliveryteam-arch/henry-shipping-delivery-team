<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request a Shipping Quote</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
}

button{
background:#0066cc;
color:white;
padding:12px;
border:none;
width:100%;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>Request a Shipping Quote</h1>
</header>

<div class="container">

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number">

<input type="text" placeholder="Pickup Country">

<input type="text" placeholder="Destination Country">

<input type="number" placeholder="Package Weight (kg)">

<select>
<option>Select Shipping Method</option>
<option>Air Freight</option>
<option>Road Freight</option>
<option>Door-to-Door Delivery</option>
<option>International Shipping</option>
</select>

<textarea rows="5" placeholder="Additional Information"></textarea>

<button type="submit">Request Quote</button>

</form>

</div>

</body>
</html>
