<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Henry Shipping Admin Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1 style="text-align:center;color:#003366;">
Henry Shipping Admin Login
</h1>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<p id="message"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyCrOslLxQGV_xBTWYgKcqvQbOwe1daWg2E",

authDomain:"henry-shipping-delivery-team.firebaseapp.com",

projectId:"henry-shipping-delivery-team",

storageBucket:"henry-shipping-delivery-team.firebasestorage.app",

messagingSenderId:"273718178411",

appId:"1:273718178411:web:6d518fb7f9fe04f359b72e"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.login = async function(){

const email = document.getElementById("email").value.trim();

const password = document.getElementById("password").value.trim();

try{

await signInWithEmailAndPassword(auth,email,password);

window.location.href="admin.html";

}catch(error){

document.getElementById("message").innerHTML =
"<span style='color:red;'>"+error.message+"</span>";

}

}

</script>

</body>

</html>
