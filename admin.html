<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Henry Shipping Admin Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:30px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#003366;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

.card{
padding:20px;
border-radius:8px;
color:white;
text-align:center;
font-weight:bold;
}

.blue{background:#0057ff;}
.green{background:#28a745;}
.orange{background:#ff9800;}
.red{background:#dc3545;}

.card h2{
margin:0;
font-size:32px;
}

.card p{
margin-top:8px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:14px;
background:#0057ff;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#003bb3;
}

#message{
margin-top:20px;
padding:10px;
font-weight:bold;
text-align:center;
}

.shipment{
border:1px solid #ddd;
padding:15px;
margin-top:15px;
border-radius:8px;
background:#fafafa;
}

.deleteBtn{
background:#dc3545;
margin-top:10px;
}

.deleteBtn:hover{
background:#b02a37;
}

</style>

</head>

<body>

<div class="container">

<h1>Henry Shipping Admin Dashboard</h1>

<div class="stats">

<div class="card blue">
<h2 id="totalShipments">0</h2>
<p>Total Shipments</p>
</div>

<div class="card green">
<h2 id="inTransit">0</h2>
<p>In Transit</p>
</div>

<div class="card orange">
<h2 id="processing">0</h2>
<p>Processing</p>
</div>

<div class="card red">
<h2 id="delivered">0</h2>
<p>Delivered</p>
</div>

</div>

<input type="text" id="tracking" placeholder="Tracking Number">

<input type="text" id="receiver" placeholder="Receiver Name">

<input type="text" id="location" placeholder="Current Location">

<input type="text" id="status" placeholder="Shipment Status">

<input type="text" id="delivery" placeholder="Estimated Delivery">

<input type="text" id="package" placeholder="Package">

<button onclick="saveShipment()">
Save Shipment
</button>

<div id="message"></div>

<hr>

<h2>Saved Shipments</h2>

<div id="shipmentsList">
Loading shipments...
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
deleteDoc,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyCrOslLxQGV_xBTWYgKcqvQbOwe1daWg2E",

authDomain:"henry-shipping-delivery-team.firebaseapp.com",

projectId:"henry-shipping-delivery-team",

storageBucket:"henry-shipping-delivery-team.firebasestorage.app",

messagingSenderId:"273718178411",

appId:"1:273718178411:web:6d518fb7f9fe04f359b72e"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveShipment = async function(){

const tracking = document.getElementById("tracking").value.trim();
const receiver = document.getElementById("receiver").value.trim();
const location = document.getElementById("location").value.trim();
const status = document.getElementById("status").value.trim();
const delivery = document.getElementById("delivery").value.trim();
const packageName = document.getElementById("package").value.trim();

if(
tracking === "" ||
receiver === "" ||
location === "" ||
status === ""
){
document.getElementById("message").innerHTML =
"<span style='color:red;'>Please fill in all required fields.</span>";
return;
}

try{

await setDoc(doc(db,"shipments",tracking),{

receiver:receiver,
location:location,
status:status,
delivery:delivery,
package:packageName

});

document.getElementById("message").innerHTML =
"<span style='color:green;'>✅ Shipment saved successfully!</span>";

document.getElementById("tracking").value="";
document.getElementById("receiver").value="";
document.getElementById("location").value="";
document.getElementById("status").value="";
document.getElementById("delivery").value="";
document.getElementById("package").value="";

loadShipments();

}catch(error){

document.getElementById("message").innerHTML =
"<span style='color:red;'>❌ "+error.message+"</span>";

}

}

async function loadShipments(){

const snapshot = await getDocs(collection(db,"shipments"));

let html = "";

let total = 0;
let transit = 0;
let processing = 0;
let delivered = 0;

snapshot.forEach((shipment)=>{

const data = shipment.data();

total++;

if(data.status === "In Transit"){
transit++;
}

if(data.status === "Processing"){
processing++;
}

if(data.status === "Delivered"){
delivered++;
}

html += `

<div class="shipment">

<h3>${shipment.id}</h3>

<p><strong>Receiver:</strong> ${data.receiver}</p>

<p><strong>Status:</strong> ${data.status}</p>

<p><strong>Location:</strong> ${data.location}</p>

<p><strong>Estimated Delivery:</strong> ${data.delivery || "Not Available"}</p>

<p><strong>Package:</strong> ${data.package || "Not Available"}</p>

<button class="deleteBtn"
onclick="deleteShipment('${shipment.id}')">
Delete Shipment
</button>

</div>

`;

});

if(html === ""){
html = "<p>No shipments found.</p>";
}

document.getElementById("totalShipments").textContent = total;
document.getElementById("inTransit").textContent = transit;
document.getElementById("processing").textContent = processing;
document.getElementById("delivered").textContent = delivered;

document.getElementById("shipmentsList").innerHTML = html;

}

window.deleteShipment = async function(id){

const ok = confirm("Delete this shipment?");

if(!ok) return;

try{

await deleteDoc(doc(db,"shipments",id));

document.getElementById("message").innerHTML =
"<span style='color:green;'>✅ Shipment deleted successfully!</span>";

loadShipments();

}catch(error){

document.getElementById("message").innerHTML =
"<span style='color:red;'>❌ " + error.message + "</span>";

}

}

loadShipments();

</script>

</body>
</html>
