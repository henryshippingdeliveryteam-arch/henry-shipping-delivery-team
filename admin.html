<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Henry Shipping Admin Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:30px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#003366;
}

input{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#0057ff;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#003bb3;
}

#message{
margin-top:20px;
padding:10px;
font-weight:bold;
text-align:center;
}

.shipment{
border:1px solid #ddd;
padding:15px;
margin-top:15px;
border-radius:8px;
background:#fafafa;
}

</style>

</head>

<body>

<div class="container">

<h1>Henry Shipping Admin Dashboard</h1>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:25px 0;">

<div style="background:#0057ff;color:white;padding:20px;border-radius:10px;text-align:center;">
<h2 id="totalShipments">0</h2>
<p>Total Shipments</p>
</div>

<div style="background:#28a745;color:white;padding:20px;border-radius:10px;text-align:center;">
<h2 id="inTransit">0</h2>
<p>In Transit</p>
</div>

<div style="background:#ff9800;color:white;padding:20px;border-radius:10px;text-align:center;">
<h2 id="processing">0</h2>
<p>Processing</p>
</div>

<div style="background:#6c757d;color:white;padding:20px;border-radius:10px;text-align:center;">
<h2 id="delivered">0</h2>
<p>Delivered</p>
</div>

  </div>

<input
type="text"
id="tracking"
placeholder="Tracking Number">

<input
type="text"
id="receiver"
placeholder="Receiver Name">

<input
type="text"
id="location"
placeholder="Current Location">

<input
type="text"
id="status"
placeholder="Shipment Status">

<input
type="text"
id="delivery"
placeholder="Estimated Delivery">

<input
type="text"
id="package"
placeholder="Package">

<button onclick="saveShipment()">
Save Shipment
</button>

<div id="message"></div>

<hr>

<h2>Saved Shipments</h2>

<input
type="text"
id="search"
placeholder="Search by Tracking Number"
onkeyup="searchShipments()">

<div id="shipmentsList">
Loading shipments...
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
deleteDoc,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
const firebaseConfig = {

apiKey:"AIzaSyCrOslLxQGV_xBTWYgKcqvQbOwe1daWg2E",

authDomain:"henry-shipping-delivery-team.firebaseapp.com",

projectId:"henry-shipping-delivery-team",

storageBucket:"henry-shipping-delivery-team.firebasestorage.app",

messagingSenderId:"273718178411",

appId:"1:273718178411:web:6d518fb7f9fe04f359b72e"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

window.saveShipment = async function(){

const tracking=document.getElementById("tracking").value.trim();
const receiver=document.getElementById("receiver").value.trim();
const location=document.getElementById("location").value.trim();
const status=document.getElementById("status").value.trim();
const delivery=document.getElementById("delivery").value.trim();
const packageName=document.getElementById("package").value.trim();

if(
tracking===""||
receiver===""||
location===""||
status===""){
document.getElementById("message").innerHTML=
"<span style='color:red;'>Please fill in all required fields.</span>";
return;
}

try{

await setDoc(doc(db,"shipments",tracking),{

receiver:receiver,
location:location,
status:status,
delivery:delivery,
package:packageName

});

document.getElementById("message").innerHTML=
"<span style='color:green;'>✅ Shipment saved successfully!</span>";

document.getElementById("tracking").value="";
document.getElementById("receiver").value="";
document.getElementById("location").value="";
document.getElementById("status").value="";
document.getElementById("delivery").value="";
document.getElementById("package").value="";

loadShipments();

}catch(error){

document.getElementById("message").innerHTML=
"<span style='color:red;'>❌ "+error.message+"</span>";

}

}

async function loadShipments(){

const snapshot=await getDocs(collection(db,"shipments"));

let html="";

snapshot.forEach((shipment)=>{

const data=shipment.data();

html+=`
<div class="shipment">

<h3>${shipment.id}</h3>

<p><strong>Receiver:</strong> ${data.receiver}</p>

<p><strong>Status:</strong> ${data.status}</p>

<p><strong>Location:</strong> ${data.location}</p>

<p><strong>Estimated Delivery:</strong> ${data.delivery || "Not Available"}</p>

<p><strong>Package:</strong> ${data.package || "Not Available"}</p>

<button onclick="editShipment('${shipment.id}')">
✏️ Edit Shipment
</button>

<button onclick="deleteShipment('${shipment.id}')">
Delete Shipment
</button>

</div>
`;

});

if(html===""){
html="<p>No shipments found.</p>";
}

document.getElementById("shipmentsList").innerHTML=html;

}

window.editShipment = async function(id){

const shipment = prompt("Enter the new shipment status:");

if(shipment == null || shipment == "") return;

await setDoc(doc(db,"shipments",id),{

receiver:"John Doe",
location:"New York, USA",
status:shipment,
delivery:"July 30, 2026",
package:"Documents"

},{merge:true});

alert("✅ Shipment updated successfully!");

loadShipments();

}
  
window.deleteShipment = async function(id){

if(!confirm("Delete this shipment?")) return;

await deleteDoc(doc(db,"shipments",id));

loadShipments();

}  
  
loadShipments();

loadShipments();

window.searchShipments = function(){

const search = document.getElementById("search").value.toUpperCase();

const shipments = document.getElementsByClassName("shipment");

for(let i = 0; i < shipments.length; i++){

const text = shipments[i].innerText.toUpperCase();

if(text.includes(search)){
shipments[i].style.display = "block";
}else{
shipments[i].style.display = "none";
}

}

}

</script>

</body>
</html>
