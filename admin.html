<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Henry Shipping Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin:30px 0;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:34px;
color:#0057ff;
margin-bottom:10px;
}

.form-box{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-top:25px;
}

.shipment{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.deleteBtn{
background:#dc3545;
}

.editBtn{
background:#ff9800;
}

.searchBox{
margin:25px 0;
}

</style>

</head>

<body>

<header>

<div class="logo">
Henry Shipping
</div>

<nav>

<a href="index.html">Home</a>

<a href="tracking.html">Track</a>

<a href="services.html">Services</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<div class="container">

<h1 style="text-align:center;color:#003366;">
Admin Dashboard
</h1>

<div style="text-align:right; margin:15px 0;">
  <button onclick="logout()">Logout</button>
</div>

<div class="dashboard">

<div class="card">

<h2 id="totalShipments">0</h2>

<p>Total Shipments</p>

</div>

<div class="card">

<h2 id="processing">0</h2>

<p>Processing</p>

</div>

<div class="card">

<h2 id="inTransit">0</h2>

<p>In Transit</p>

</div>

<div class="card">

<h2 id="delivered">0</h2>

<p>Delivered</p>

</div>

</div>

<div class="form-box">

<h2>Create / Update Shipment</h2>

<input id="tracking" placeholder="Tracking Number">

<input id="receiver" placeholder="Receiver Name">

<input id="location" placeholder="Current Location">

<input id="status" placeholder="Status">

<input id="delivery" placeholder="Estimated Delivery">

<input id="package" placeholder="Package">

<button onclick="saveShipment()">

Save Shipment

</button>

<p id="message"></p>

</div>

<div class="searchBox">

<input
type="text"
id="search"
placeholder="Search shipment..."
onkeyup="searchShipment()">

</div>

<h2>All Shipments</h2>

<div id="shipmentsList">

Loading...

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
  getAuth,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
const firebaseConfig={

apiKey:"AIzaSyCrOslLxQGV_xBTWYgKcqvQbOwe1daWg2E",

authDomain:"henry-shipping-delivery-team.firebaseapp.com",

projectId:"henry-shipping-delivery-team",

storageBucket:"henry-shipping-delivery-team.firebasestorage.app",

messagingSenderId:"273718178411",

appId:"1:273718178411:web:6d518fb7f9fe04f359b72e"

};

const app=initializeApp(firebaseConfig);

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});

const db=getFirestore(app);

window.saveShipment=async function(){

const tracking=document.getElementById("tracking").value.trim();

const receiver=document.getElementById("receiver").value.trim();

const location=document.getElementById("location").value.trim();

const status=document.getElementById("status").value.trim();

const delivery=document.getElementById("delivery").value.trim();

const packageName=document.getElementById("package").value.trim();

if(!tracking||!receiver||!location||!status){

document.getElementById("message").innerHTML="Please complete all required fields.";

return;

}

try {

await setDoc(doc(db,"shipments",tracking),{
  receiver,
  location,
  status,
  delivery,
  package:packageName
});

document.getElementById("message").innerHTML="✅ Shipment saved successfully.";

loadShipments();

} catch(error) {

document.getElementById("message").innerHTML =
"❌ " + error.message;

}
};

async function loadShipments(){

const snapshot=await getDocs(collection(db,"shipments"));

let html="";

let total=0;

let processing=0;

let transit=0;

let delivered=0;

snapshot.forEach((shipment)=>{

const data=shipment.data();

total++;

if(data.status==="Processing") processing++;

if(data.status==="In Transit") transit++;

if(data.status==="Delivered") delivered++;

html+=`

<div class="shipment">

<h3>${shipment.id}</h3>

<p><strong>Receiver:</strong> ${data.receiver}</p>

<p><strong>Status:</strong> ${data.status}</p>

<p><strong>Current Location:</strong> ${data.location}</p>

<p><strong>Estimated Delivery:</strong> ${data.delivery || "Not Available"}</p>

<p><strong>Package:</strong> ${data.package || "Not Available"}</p>

<div class="actions">

<button class="editBtn"
onclick="editShipment(
'${shipment.id}',
'${data.receiver}',
'${data.location}',
'${data.status}',
'${data.delivery || ""}',
'${data.package || ""}'
)">
Edit
</button>

<button class="deleteBtn"
onclick="deleteShipment('${shipment.id}')">
Delete
</button>

</div>

</div>

`;

});

document.getElementById("shipmentsList").innerHTML =
html || "<p>No shipments found.</p>";

document.getElementById("totalShipments").textContent = total;

document.getElementById("processing").textContent = processing;

document.getElementById("inTransit").textContent = transit;

document.getElementById("delivered").textContent = delivered;

}

window.editShipment=function(
tracking,
receiver,
location,
status,
delivery,
packageName
){

document.getElementById("tracking").value=tracking;

document.getElementById("receiver").value=receiver;

document.getElementById("location").value=location;

document.getElementById("status").value=status;

document.getElementById("delivery").value=delivery;

document.getElementById("package").value=packageName;

window.scrollTo({
top:0,
behavior:"smooth"
});

};

window.deleteShipment = async function(id){

const ok = confirm("Delete this shipment?");

if(!ok) return;

await deleteDoc(doc(db,"shipments",id));

loadShipments();

};

window.searchShipment=function(){

const input=document.getElementById("search").value.toLowerCase();

const shipments=document.querySelectorAll(".shipment");

shipments.forEach((shipment)=>{

shipment.style.display=
shipment.innerText.toLowerCase().includes(input)
? "block"
: "none";

});

};

loadShipments();

window.logout = async function () {
  await signOut(auth);
  window.location.href = "login.html";
};

</script>

<footer>

<p>© 2026 Henry Shipping Delivery Team</p>

<p>Fast • Secure • Reliable</p>

</footer>

</body>

</html>
