<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#003366;
}

input{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#0057ff;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Henry Shipping Admin</h1>

<input placeholder="Tracking Number">
<input placeholder="Receiver">
<input placeholder="Current Location">
<input placeholder="Status">
<input placeholder="Estimated Delivery">
<input placeholder="Package">

<button>Save Shipment</button>

</div>

</body>
</html>
