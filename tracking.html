<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Shipment | Henry Shipping</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
Henry Shipping
</div>

<nav>

<a href="index.html">Home</a>

<a href="tracking.html">Track</a>

<a href="services.html">Services</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<div class="container">

<h1 style="text-align:center;color:#003366;">
Track Your Shipment
</h1>

<input
type="text"
id="tracking"
placeholder="Enter Tracking Number">

<button onclick="track()">

Track Shipment

</button>

<div id="result" style="margin-top:30px;"></div>

</div>

<footer>

<p>© 2026 Henry Shipping Delivery Team</p>

</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyCrOslLxQGV_xBTWYgKcqvQbOwe1daWg2E",

authDomain:"henry-shipping-delivery-team.firebaseapp.com",

projectId:"henry-shipping-delivery-team",

storageBucket:"henry-shipping-delivery-team.firebasestorage.app",

messagingSenderId:"273718178411",

appId:"1:273718178411:web:6d518fb7f9fe04f359b72e"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

window.track=async function(){

const tracking=document.getElementById("tracking").value.trim();

if(tracking===""){

document.getElementById("result").innerHTML="<p>Please enter a tracking number.</p>";

return;

}

const docRef=doc(db,"shipments",tracking);

const docSnap=await getDoc(docRef);

if(docSnap.exists()){

const data = docSnap.data();

document.getElementById("result").innerHTML = `

<div class="card">

<h2>Shipment Found</h2>

<p><strong>Tracking Number:</strong> ${tracking}</p>

<p><strong>Receiver:</strong> ${data.receiver}</p>

<p><strong>Status:</strong> ${data.status}</p>

<p><strong>Current Location:</strong> ${data.location}</p>

<p><strong>Estimated Delivery:</strong> ${data.delivery || "Not Available"}</p>

<p><strong>Package:</strong> ${data.package || "Not Available"}</p>

<img src="${data.image}" 
     alt="Package Image"
     style="width:100%;max-width:350px;margin-top:15px;border-radius:10px;">

${data.photo ? `
<div style="margin-top:20px;text-align:center;">
    <img src="${data.photo}"
         alt="Package Photo"
         style="max-width:100%;max-height:300px;border-radius:10px;border:2px solid #ddd;">
</div>
` : ""}

<h2>Shipment Progress</h2>

<div class="timeline">

<div class="step" id="processingStep">📦 Processing</div>

<div class="step" id="transitStep">🚚 In Transit</div>

<div class="step" id="deliveryStep">🚛 Out for Delivery</div>

<div class="step" id="deliveredStep">✅ Delivered</div>

</div>

</div>

`;

const status = data.status;

if(status==="Processing"){
processingStep.classList.add("active");
}

if(status==="In Transit"){
processingStep.classList.add("completed");
transitStep.classList.add("active");
}

if(status==="Out for Delivery"){
processingStep.classList.add("completed");
transitStep.classList.add("completed");
deliveryStep.classList.add("active");
}

if(status==="Delivered"){
processingStep.classList.add("completed");
transitStep.classList.add("completed");
deliveryStep.classList.add("completed");
deliveredStep.classList.add("active");
}

}else{

document.getElementById("result").innerHTML=`

<div class="card">

<h2 style="color:red;">
Tracking Number Not Found
</h2>

<p>
Please check your tracking number and try again.
</p>

</div>

`;

}

}

</script>

</body>
</html>
