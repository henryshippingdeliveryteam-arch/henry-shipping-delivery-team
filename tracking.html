<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Shipment - Henry Shipping Delivery Team</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:40px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#003366;
}

input{
    width:100%;
    padding:15px;
    margin:20px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#0057ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#003ecc;
}

#result{
    margin-top:30px;
    padding:20px;
    background:#fafafa;
    border-radius:8px;
}
</style>

</head>

<body>

<div class="container">

<h1>Track Your Shipment</h1>

<input
type="text"
id="tracking"
placeholder="Enter Tracking Number">

<button onclick="track()">Track Shipment</button>

<div id="result"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "henry-shipping-delivery-team.firebaseapp.com",

projectId: "henry-shipping-delivery-team",

storageBucket: "henry-shipping-delivery-team.firebasestorage.app",

messagingSenderId: "273718178411",

appId: "1:273718178411:web:6d518fb7f9fe04f359b72e"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.track = async function(){

const tracking=document.getElementById("tracking").value.trim();

const docRef=doc(db,"shipments",tracking);

const docSnap=await getDoc(docRef);

if(docSnap.exists()){

const data=docSnap.data();

document.getElementById("result").innerHTML=`

<h2>Shipment Details</h2>

<p><strong>Tracking Number:</strong> ${tracking}</p>

<p><strong>Status:</strong> ${data.status}</p>

<p><strong>Current Location:</strong> ${data.location}</p>

<p><strong>Receiver:</strong> ${data.receiver}</p>

<p><strong>Estimated Delivery:</strong> ${data.delivery || "Not Available"}</p>

<p><strong>Package:</strong> ${data.package || "Not Available"}</p>

`;

}else{

document.getElementById("result").innerHTML=`
<p style="color:red;font-weight:bold;">
❌ Tracking number not found.
</p>
`;

}

}

</script>

</body>
</html>
