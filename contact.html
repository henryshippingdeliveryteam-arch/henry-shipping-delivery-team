<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
}

button{
background:#0066cc;
color:white;
padding:12px 20px;
border:none;
cursor:pointer;
}
</style>

</head>

<body>

<header>
<h1>Contact Henry Shipping Delivery Team</h1>
</header>

<div class="container">

<p><strong>Email:</strong> henryshippingdeliveryteam@gmail.com</p>

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="5" placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</body>
</html>
